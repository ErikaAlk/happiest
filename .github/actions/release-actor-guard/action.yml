name: Release Actor Guard
description: Verify the triggering actor has admin permission on this repository (or is an explicitly trusted actor) before release/deploy workflows run.

inputs:
  trusted_actors:
    description: "Comma-separated list of explicitly trusted actors (e.g. a release bot) that can bypass the repository admin check"
    required: false
    # Scheduled workflows run as `github-actions` / `github-actions[bot]`. We treat these as trusted
    # so nightly release automation can run, while workflow_dispatch still requires repository admin permission.
    default: "github-actions[bot],github-actions"

runs:
  using: composite
  steps:
    - name: Verify triggering actor is a repository admin
      shell: bash
      env:
        INPUT_TRUSTED_ACTORS: ${{ inputs.trusted_actors }}
        REPO: ${{ github.repository }}
        REPO_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        actor="${GITHUB_TRIGGERING_ACTOR:-${GITHUB_ACTOR:-}}"
        if [ -z "${actor}" ]; then
          echo "Unable to resolve triggering actor." >&2
          exit 1
        fi

        IFS=',' read -r -a trusted <<< "${INPUT_TRUSTED_ACTORS:-}"
        for raw in "${trusted[@]}"; do
          candidate="$(echo "${raw}" | xargs)"
          if [ -n "${candidate}" ] && [ "${candidate}" = "${actor}" ]; then
            echo "Actor '${actor}' is explicitly trusted; allowing release workflow."
            exit 0
          fi
        done

        github_api_status() {
          local endpoint="$1"
          local response_file="$2"
          local curl_args=(
            -sS
            --connect-timeout 10
            --max-time 30
            --retry 3
            --retry-delay 1
            --retry-max-time 90
            --retry-all-errors
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${REPO_TOKEN}"
          )
          curl "${curl_args[@]}" \
            "$endpoint" \
            -o "$response_file" \
            -w "%{http_code}"
        }

        actor_enc="$(jq -nr --arg v "${actor}" '$v|@uri')"
        endpoint="https://api.github.com/repos/${REPO}/collaborators/${actor_enc}/permission"
        resp_file="$(mktemp)"
        if ! status="$(github_api_status "$endpoint" "$resp_file")"; then
          echo "Unable to reach GitHub while determining repo permission for '${actor}'." >&2
          cat "$resp_file" >&2
          rm -f "$resp_file"
          exit 1
        fi

        if [ "$status" != "200" ]; then
          echo "Unable to determine repo permission for '${actor}' (HTTP ${status})." >&2
          cat "$resp_file" >&2
          rm -f "$resp_file"
          exit 1
        fi

        perm="$(jq -r '.permission // ""' "$resp_file")"
        rm -f "$resp_file"

        if [ "$perm" != "admin" ]; then
          echo "Actor '${actor}' is not authorized (repo permission='${perm}')." >&2
          exit 1
        fi

        echo "Actor '${actor}' is a repo admin; allowing release workflow."
